<!doctype html>
<html><head><meta charset="utf-8"><title>running</title></head>
<body>
<script>
  // 每次测试从干净的本地状态开始（设置 / SRS 记录都可能影响断言）
  try { localStorage.clear(); } catch (e) {}
</script>
<iframe id="f" style="width:800px;height:600px"></iframe>
<script>
  document.getElementById('f').src = '../index.html?t=' + Date.now();

const log = [];
const ok = (name, cond, extra) => {
  log.push((cond ? 'PASS ' : 'FAIL ') + name + (extra ? ' :: ' + extra : ''));
  dumpLog();   // 实时刷新，卡住时也能看到进度
};
const sleep = ms => new Promise(r => setTimeout(r, ms));

function typeChars(win, str) {
  const doc = win.document;
  const catcher = doc.getElementById('catcher');
  for (const ch of str) {
    catcher.value = ch;
    catcher.dispatchEvent(new win.Event('input', { bubbles: true }));
  }
}
/** 等 iframe 里的应用真正就绪：先等 load 事件，再等首题渲染出来 */
function waitLoad(frame) {
  return new Promise(resolve => {
    const d = frame.contentDocument;
    if (d && d.readyState === 'complete' && d.getElementById('catcher')) return resolve();
    frame.addEventListener('load', () => resolve(), { once: true });
  });
}

async function waitReady(frame, url) {
  if (url && !frame.getAttribute('src')) frame.src = url;   // 首次导航由这里发起
  for (let attempt = 0; attempt < 4; attempt++) {
    await waitLoad(frame);
    let d = frame.contentDocument;
    // 应用启动完成会打上 data-app-ready="1" 且所有模块都挂载到全局
    for (let i = 0; i < 120 && d; i++) {
      const w = frame.contentWindow;
      if (d.documentElement.getAttribute('data-app-ready') === '1' &&
          d.querySelector('#pinyin .ch') &&
          w && w.Srs && w.Stats && w.Strokes && w.Ime && w.Stories && w.Dict) {
        return d;
      }
      await sleep(20);
      d = frame.contentDocument;
    }
    if (!url) return d;
    frame.src = url + (url.indexOf('?') === -1 ? '?' : '&') + 'retry=' + attempt + '-' + Date.now();
    await sleep(60);
  }
  return frame.contentDocument;
}

function pinyinText(win) {
  return [...win.document.querySelectorAll('#pinyin .ch')].map(s => s.textContent).join('');
}
function curIndex(win) {
  const cells = [...win.document.querySelectorAll('#pinyin .ch')];
  return cells.findIndex(c => c.classList.contains('is-cur'));
}

function dumpLog() {
  let pre = document.getElementById('log');
  if (!pre) {
    pre = document.createElement('pre');
    pre.id = 'log';
    document.body.appendChild(pre);
  }
  pre.textContent = log.join('\n') + '\n[最后进度] ' + (log.length) + ' 项';
}

window.onerror = (msg, src, line, col) => {
  log.push('FAIL 脚本异常 :: ' + msg + ' @' + line + ':' + col);
  dumpLog();
  document.title = 'error';
};

window.onload = async () => {
  try {
  const f = document.getElementById('f');
  const doc0 = await waitReady(f, '../index.html?t=' + Date.now());
  await sleep(100);
  const win = f.contentWindow, doc = doc0;
  win.addEventListener('error', ev => {
    log.push('FAIL 应用异常 :: ' + (ev.message || ev.error) + ' @' + (ev.lineno || '?'));
  });

  log.push('DEBUG readyState=' + doc.readyState +
           ' scripts=' + doc.querySelectorAll('script').length +
           ' pinyinCells=' + doc.querySelectorAll('#pinyin .ch').length +
           ' hanzi=' + doc.getElementById('hanzi').textContent +
           ' srs=' + (typeof win.Srs) + ' stats=' + (typeof win.Stats) +
           ' bootError=' + (doc.documentElement.getAttribute('data-boot-error') || '-'));
  ok('渲染首词汉字', doc.getElementById('hanzi').textContent.trim().length > 0, doc.getElementById('hanzi').textContent);
  ok('生成 pinyin cells', doc.querySelectorAll('#pinyin .ch').length > 0, pinyinText(win));
  ok('进度条存在', doc.querySelectorAll('#progress-fill').length === 1);

  // 取当前词的拼音字母（无调）来模拟正确输入
  const cells = win.Pinyin.buildCells(doc.getElementById('english').dataset.x || '', false);
  const wordCells = [...doc.querySelectorAll('#pinyin .ch')].map(c => c.textContent).join('');
  typeChars(win, wordCells);
  await sleep(60);
  ok('正确输入后字色变 ok', doc.querySelectorAll('#pinyin .ch.is-ok').length === wordCells.length,
     doc.querySelectorAll('#pinyin .ch.is-ok').length + '/' + wordCells.length);

  await sleep(400);
  ok('自动进入下一词', doc.getElementById('run-pos').textContent.startsWith('2 /'), doc.getElementById('run-pos').textContent);

  // 错误输入
  const before = doc.getElementById('st-acc').textContent;
  typeChars(win, 'zzz');
  await sleep(60);
  ok('错误输入降低正确率', doc.getElementById('st-acc').textContent !== before,
     before + ' -> ' + doc.getElementById('st-acc').textContent);
  ok('有连击/错误反馈', doc.querySelectorAll('#pinyin .is-err').length >= 0);
  ok('连击归零', doc.getElementById('st-streak').textContent === '0', doc.getElementById('st-streak').textContent);

  // 开声调模式
  doc.getElementById('tg-tones').click();
  await sleep(200);
  ok('声调模式出现数字位', doc.querySelectorAll('#pinyin .is-tone').length > 0,
     doc.querySelectorAll('#pinyin .is-tone').length + ' digits');
  ok('声调模式按钮按下', doc.getElementById('tg-tones').getAttribute('aria-pressed') === 'true');

  // 声调模式：按 numbered 输入应完成一个词
  const toneCells = [...doc.querySelectorAll('#pinyin .ch')].map(c => c.textContent).join('');
  const posBefore = doc.getElementById('run-pos').textContent;
  typeChars(win, toneCells);
  await sleep(450);
  ok('声调模式可完成单词', doc.getElementById('run-pos').textContent !== posBefore,
     posBefore + ' -> ' + doc.getElementById('run-pos').textContent);

  // 听音模式
  doc.getElementById('tg-echo').click();
  await sleep(200);
  ok('听音模式模糊卡片', doc.getElementById('card').classList.contains('masked'));
  ok('听音模式显示答案按钮', !doc.getElementById('btn-reveal').hidden);
  doc.getElementById('btn-reveal').click();
  await sleep(100);
  ok('点显示答案后揭示', !doc.getElementById('card').classList.contains('masked'));

  // 主题切换
  doc.getElementById('tg-theme').click();
  await sleep(50);
  ok('主题切换为 light', doc.documentElement.getAttribute('data-theme') === 'light',
     doc.documentElement.getAttribute('data-theme'));
  doc.getElementById('tg-theme').click();

  // 数量改为 10 并快速跑完全部，验证结果页
  doc.getElementById('tg-echo').click();  // 关掉听音，加速
  doc.getElementById('tg-tones').click(); // 关掉声调
  const sel = doc.getElementById('sel-count');
  sel.value = '10';
  sel.dispatchEvent(new win.Event('change', { bubbles: true }));
  await sleep(200);
  ok('数量切换后重置到 1 / 10', doc.getElementById('run-pos').textContent.startsWith('1 / 10'), doc.getElementById('run-pos').textContent);

  for (let i = 0; i < 12; i++) {
    const txt = [...doc.querySelectorAll('#pinyin .ch')].map(c => c.textContent).join('');
    if (!txt) break;
    typeChars(win, txt);
    await sleep(320);
    if (!doc.getElementById('screen-result').hidden) break;
  }
  ok('跑完出现结果页', !doc.getElementById('screen-result').hidden);
  ok('结果页 CPM 有值', parseInt(doc.getElementById('rs-cpm').textContent, 10) > 0, doc.getElementById('rs-cpm').textContent);
  ok('结果页正确率 100%', doc.getElementById('rs-acc').textContent === '100%', doc.getElementById('rs-acc').textContent);
  ok('结果页词数 10', doc.getElementById('rs-words').textContent === '10', doc.getElementById('rs-words').textContent);

  // 再练一轮
  doc.getElementById('btn-again').click();
  await sleep(200);
  ok('再来一轮回到输入页', doc.getElementById('screen-result').hidden && doc.getElementById('run-pos').textContent.startsWith('1 / 10'));

  // ---------- 句模式 ----------
  const modeSel = doc.getElementById('sel-mode');
  modeSel.value = 'sentence';
  modeSel.dispatchEvent(new win.Event('change', { bubbles: true }));
  await sleep(250);

  const units = () => [...doc.querySelectorAll('#sentence .unit')];
  const unitCells = u => [...u.querySelectorAll('.u-py .ch')].map(c => c.textContent).join('');
  const unitHz = u => u.querySelector('.u-hz').textContent;
  const hzText = units().map(unitHz).join('');
  const matched = win.SENTENCE_LISTS.all.filter(s => s.hanzi === hzText)[0];

  ok('句模式：显示逐字单元', units().length > 0, units().length + ' units -> ' + hzText);
  ok('句模式：与词库句子一致', !!matched, hzText);
  ok('句模式：单元数等于汉字数', units().length === [...hzText].length, units().length + ' vs ' + [...hzText].length);
  ok('句模式：隐藏单词布局', doc.getElementById('hanzi').hidden && doc.getElementById('pinyin').hidden);
  ok('句模式：进度含单位', /\/\s*\d+\s*句/.test(doc.getElementById('run-pos').textContent), doc.getElementById('run-pos').textContent);

  const last = units()[units().length - 1];
  ok('句模式：末位是标点单元', last.classList.contains('is-punct'), last.className);
  ok('句模式：标点提示为键帽', /^[,.!?]$/.test(last.querySelector('.ch.is-punctkey').textContent),
     last.querySelector('.ch.is-punctkey').textContent);

  // 只打第一个字，验证逐字点亮
  typeChars(win, unitCells(units()[0]));
  await sleep(80);
  ok('句模式：打完一字即点亮', units()[0].classList.contains('is-done'));
  ok('句模式：下一字高亮为当前', units()[1].classList.contains('is-cur'), units()[1].className);

  // 打完整句
  const sentencePos = doc.getElementById('run-pos').textContent;
  for (let i = 1; i < units().length; i++) typeChars(win, unitCells(units()[i]));
  await sleep(450);
  ok('句模式：整句完成进入下一句', doc.getElementById('run-pos').textContent !== sentencePos,
     sentencePos + ' -> ' + doc.getElementById('run-pos').textContent);

  // 声调 + 句模式
  doc.getElementById('tg-tones').click();
  await sleep(250);
  ok('句模式+声调：出现声调位', doc.querySelectorAll('#sentence .u-py .ch.is-tone').length > 0,
     doc.querySelectorAll('#sentence .u-py .ch.is-tone').length + ' tone cells');

  // 听音 + 句模式
  doc.getElementById('tg-echo').click();
  await sleep(250);
  ok('句模式+听音：卡片模糊', doc.getElementById('card').classList.contains('masked'));
  ok('句模式+听音：可揭示', !doc.getElementById('btn-reveal').hidden);

  // 回到词模式，确认还原
  doc.getElementById('tg-echo').click();
  doc.getElementById('tg-tones').click();
  await sleep(150);
  modeSel.value = 'word';
  modeSel.dispatchEvent(new win.Event('change', { bubbles: true }));
  await sleep(250);
  ok('切回词模式：恢复大字号汉字', !doc.getElementById('hanzi').hidden && doc.getElementById('sentence').hidden);
  ok('切回词模式：进度单位为词', /词/.test(doc.getElementById('run-pos').textContent), doc.getElementById('run-pos').textContent);

  // ---------- SRS 排程 ----------
  const SRS_KEY = 'echo-hanzi:srs:v1';

  const tdb = {};
  const lapse = win.Srs.schedule(tdb, { hanzi: '测试' }, false, Date.now());
  ok('SRS：答错回到 10 分钟后再来',
     lapse.reps === 0 && lapse.interval === 0 && Math.round((lapse.due - Date.now()) / 60000) === 10,
     'reps=' + lapse.reps + ' dueInMin=' + ((lapse.due - Date.now()) / 60000).toFixed(1));
  const recovered = win.Srs.schedule(tdb, { hanzi: '测试' }, true, Date.now());
  ok('SRS：答对后间隔从 1 天起', recovered.interval === 1, 'interval=' + recovered.interval);

  let stored = null;
  try { stored = JSON.parse(localStorage.getItem(SRS_KEY) || 'null'); } catch (e) { stored = null; }
  const storedKeys = stored ? Object.keys(stored) : [];
  ok('SRS：作答后写入本地记录', storedKeys.length > 0, storedKeys.slice(0, 3).join(',') + ' … 共 ' + storedKeys.length + ' 条');
  ok('SRS：词与句分开记账',
     storedKeys.some(k => k.indexOf('w:') === 0) && storedKeys.some(k => k.indexOf('s:') === 0),
     storedKeys.filter(k => k.indexOf('s:') === 0).length + ' 句 / ' +
     storedKeys.filter(k => k.indexOf('w:') === 0).length + ' 词');

  const cleanRec = stored[storedKeys.filter(k => k.indexOf('w:') === 0)[0]];
  ok('SRS：无错题排到 1 天后', cleanRec && cleanRec.interval === 1 && cleanRec.due > Date.now(),
     cleanRec ? 'interval=' + cleanRec.interval : 'missing');

  // 注入一条“已到期”的记录，看它是否被优先排出
  const target = win.WORD_LISTS.hsk1[0];
  localStorage.setItem(SRS_KEY, JSON.stringify({
    ['w:' + target.hanzi]: { reps: 2, interval: 3, due: Date.now() - 60000, seen: 2, errors: 0, last: Date.now() - 4 * 86400000 }
  }));
  localStorage.setItem('echo-hanzi:v1', JSON.stringify({
    mode: 'word', level: 'hsk1', count: 10, tones: false, echo: false, speech: false, sound: false, theme: 'dark'
  }));

  const f2 = document.createElement('iframe');
  f2.width = 700; f2.height = 560; f2.src = '../index.html?srs=' + Date.now();
  document.body.appendChild(f2);
  const d2ready = await waitReady(f2, '../index.html?srs=' + Date.now());
  await sleep(100);
  const d2 = d2ready || f2.contentDocument;
  ok('SRS：第二实例已加载', !!d2 && !!d2.getElementById('hanzi'), 'doc=' + !!d2);

  ok('SRS：到期题排在本轮第一', d2.getElementById('hanzi').textContent === target.hanzi,
     d2.getElementById('hanzi').textContent + ' / 期望 ' + target.hanzi);
  ok('SRS：卡片角标标记复习', d2.getElementById('card-badge').textContent === '复习',
     d2.getElementById('card-badge').textContent);
  ok('SRS：顶栏显示待复习数', !d2.getElementById('run-due').hidden &&
     /待复习\s*1/.test(d2.getElementById('run-due').textContent),
     d2.getElementById('run-due').textContent);

  // ---------- 数据看板 ----------
  let statsStore = null;
  try { statsStore = JSON.parse(localStorage.getItem('echo-hanzi:stats:v1') || 'null'); } catch (e) { statsStore = null; }
  ok('看板数据：记录了每轮成绩', !!statsStore && statsStore.sessions.length >= 1,
     statsStore ? statsStore.sessions.length + ' 轮' : 'missing');
  ok('看板数据：记录了音节样本', !!statsStore && statsStore.syllables > 0,
     statsStore ? statsStore.syllables + ' 个音节' : 'missing');

  doc.getElementById('btn-stats').click();
  await sleep(150);

  ok('看板：打开后隐藏练习页', !doc.getElementById('screen-stats').hidden && doc.getElementById('screen-typing').hidden);
  ok('看板：概况卡有数据', doc.querySelectorAll('#dash-summary .stat').length === 4,
     doc.querySelectorAll('#dash-summary .stat').length + ' cards');
  ok('看板：趋势图渲染', !!doc.querySelector('#dash-trend svg'), doc.querySelector('#dash-trend svg') ? 'svg ok' : 'no svg');
  ok('看板：声母/韵母分栏', doc.querySelectorAll('#dash-errors .bar-col').length === 2);
  ok('看板：错误条有样本', doc.querySelectorAll('#dash-errors .bar-row').length > 0,
     doc.querySelectorAll('#dash-errors .bar-row').length + ' 条');
  const toneEls = doc.querySelectorAll('#dash-tones .bar-row');
  ok('看板：声调区有内容', toneEls.length > 0 || !!doc.querySelector('#dash-tones .panel-empty'),
     toneEls.length + ' 条');
  ok('看板：掌握分布图例齐全',
     doc.querySelectorAll('#dash-mastery .mastery-key').length === 4,
     doc.querySelectorAll('#dash-mastery .mastery-key').length + ' keys');
  ok('看板：掌握分布合计等于题量',
     /共\s*338\s*词句/.test(doc.getElementById('dash-mastery-sub').textContent),
     doc.getElementById('dash-mastery-sub').textContent);

  // 看板打开时打字不应影响进度
  const posBeforeDash = doc.getElementById('run-pos').textContent;
  typeChars(win, 'abc');
  await sleep(80);
  ok('看板：打开时输入被忽略', doc.getElementById('run-pos').textContent === posBeforeDash);

  // Esc 返回
  doc.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  await sleep(120);
  ok('看板：Esc 返回练习', doc.getElementById('screen-stats').hidden && !doc.getElementById('screen-typing').hidden);

  // 清空
  win.confirm = () => true;
  doc.getElementById('btn-stats').click();
  await sleep(100);
  doc.getElementById('btn-dash-reset').click();
  await sleep(150);
  ok('看板：清空后回到空状态', !doc.getElementById('dash-empty').hidden,
     'empty visible=' + !doc.getElementById('dash-empty').hidden);

  // ---------- 弱点专项（自适应出题） ----------
  localStorage.setItem('echo-hanzi:stats:v1', JSON.stringify({
    sessions: [], items: 0, syllables: 120,
    initials: { 'zh': { a: 20, e: 16 }, 'n': { a: 20, e: 2 } },
    finals: { 'ang': { a: 18, e: 9 } },
    tones: { '3': { a: 12, e: 8 } }
  }));

  const f3 = document.createElement('iframe');
  f3.width = 700; f3.height = 560;
  document.body.appendChild(f3);
  const d3 = await waitReady(f3, '../index.html?drill=' + Date.now());
  const w3 = f3.contentWindow;

  d3.getElementById('btn-stats').click();
  await sleep(150);

  const drillBtns = [...d3.querySelectorAll('#dash-drills .drill-btn')];
  const drillLabels = drillBtns.map(b => b.querySelector('.drill-label').textContent);
  ok('专项：看板给出建议', drillBtns.length >= 3, drillLabels.join(' / '));
  ok('专项：按错误率排序且首项是混合', drillLabels[0] === '弱点混合', drillLabels[0]);
  ok('专项：显示可用题量', /题可用/.test(drillBtns[1].querySelector('.drill-meta').textContent),
     drillBtns[1].querySelector('.drill-meta').textContent);

  const zhBtn = drillBtns.filter(b => b.querySelector('.drill-label').textContent === '声母 zh')[0];
  zhBtn.click();
  await sleep(250);

  ok('专项：进入后显示专项 chip',
     !d3.getElementById('run-drill').hidden && /专项：声母 zh/.test(d3.getElementById('run-drill').textContent),
     d3.getElementById('run-drill').textContent);

  let allZh = true;
  const seen = [];
  for (let i = 0; i < 3; i++) {
    const py = [...d3.querySelectorAll('#pinyin .ch')].map(c => c.textContent).join('');
    seen.push(py);
    if (py.indexOf('zh') === -1) allZh = false;
    for (const ch of py) {
      const c = d3.getElementById('catcher');
      c.value = ch;
      c.dispatchEvent(new w3.Event('input', { bubbles: true }));
    }
    await sleep(320);
  }
  ok('专项：出的题都含声母 zh', allZh, seen.join(' , '));

  // 退出专项
  d3.getElementById('run-drill').click();
  await sleep(250);
  ok('专项：可退出回到普通练习',
     !/专项：/.test(d3.getElementById('run-drill').textContent),
     d3.getElementById('run-drill').textContent);

  // 声调专项会自动开声调模式
  d3.getElementById('btn-stats').click();
  await sleep(150);
  const toneBtn = [...d3.querySelectorAll('#dash-drills .drill-btn')]
    .filter(b => b.querySelector('.drill-label').textContent === '第 3 声')[0];
  ok('专项：声调项存在', !!toneBtn, toneBtn ? 'ok' : 'missing');
  if (toneBtn) {
    toneBtn.click();
    await sleep(250);
    ok('专项：声调专项自动开声调模式',
       d3.getElementById('tg-tones').getAttribute('aria-pressed') === 'true');
    ok('专项：题目出现声调位', d3.querySelectorAll('#pinyin .ch.is-tone').length > 0,
       d3.querySelectorAll('#pinyin .ch.is-tone').length + ' digits');
  }

  // ---------- 汉字笔顺动画 ----------
  ok('笔顺：模块可用', typeof win.Strokes === 'object' && typeof win.Strokes.getStrokes === 'function');
  const demoStrokes = win.Strokes.getStrokes('中');
  ok('笔顺：获取笔画路径正常', Array.isArray(demoStrokes) && demoStrokes.length === 4, '中 = ' + demoStrokes.length + ' 画');

  // 点击汉字打开笔顺浮层
  doc.getElementById('hanzi').click();
  await sleep(200);
  ok('笔顺：点击汉字打开浮层', !doc.getElementById('stroke-modal').hidden);
  ok('笔顺：米字格背景渲染', !!doc.querySelector('.mige-bg'));
  ok('笔顺：动态笔画生成', doc.querySelectorAll('#stroke-canvas path').length > 0,
     doc.querySelectorAll('#stroke-canvas path').length + ' 笔画 paths');

  // 测试单步按钮
  doc.getElementById('btn-stroke-next').click();
  await sleep(100);
  ok('笔顺：下一步步进正常', !!doc.querySelector('#stroke-canvas .stroke-path.is-active'));

  // 浮层打开时键盘输入被隔离
  const currentPosVal = doc.getElementById('run-pos').textContent;
  typeChars(win, 'abc');
  await sleep(50);
  ok('笔顺：浮层打开时打字输入被隔离', doc.getElementById('run-pos').textContent === currentPosVal);

  // Esc 键关闭浮层
  doc.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  await sleep(150);
  ok('笔顺：按 Esc 关闭浮层', doc.getElementById('stroke-modal').hidden);

  // 点击卡片右上角笔顺按钮
  doc.getElementById('btn-show-stroke').click();
  await sleep(150);
  ok('笔顺：点击卡片笔顺按钮唤起', !doc.getElementById('stroke-modal').hidden);
  doc.getElementById('btn-stroke-close').click();
  await sleep(150);
  ok('笔顺：点击关闭按钮关闭', doc.getElementById('stroke-modal').hidden);

  // ---------- 真实中文输入法 (IME 模式) ----------
  ok('输入法：Ime 模块可用', typeof win.Ime === 'object' && typeof win.Ime.queryCandidates === 'function');
  const cands = win.Ime.queryCandidates('zhong', '中');
  ok('输入法：候选词查询正常', Array.isArray(cands) && cands.length > 0 && cands[0] === '中', '首选 = ' + cands[0]);

  // 开启输入法模式
  doc.getElementById('tg-ime').click();
  await sleep(200);
  ok('输入法：按钮处于按下状态', doc.getElementById('tg-ime').getAttribute('aria-pressed') === 'true');
  ok('输入法：顶栏提示输入法模式', /输入法/.test(doc.getElementById('run-mode').textContent), doc.getElementById('run-mode').textContent);

  // 输入拼音字母，校验悬浮候选框弹出
  typeChars(win, 'zhong');
  await sleep(150);
  ok('输入法：敲字母弹出候选框', !doc.getElementById('ime-popup').hidden);
  ok('输入法：拼音 buffer 正确显示', doc.getElementById('ime-buffer').textContent === 'zhong', doc.getElementById('ime-buffer').textContent);
  ok('输入法：候选词项渲染', doc.querySelectorAll('#ime-candidates .ime-cand-item').length > 0,
     doc.querySelectorAll('#ime-candidates .ime-cand-item').length + ' 候选词');

  // 按空格键上屏首选词
  const beforeImePos = doc.getElementById('run-pos').textContent;
  const catcherEl = doc.getElementById('catcher');
  catcherEl.dispatchEvent(new win.KeyboardEvent('keydown', { key: ' ', bubbles: true }));
  await sleep(350);

  ok('输入法：空格选词后候选框关闭', doc.getElementById('ime-popup').hidden);

  // 切回常规拼音模式，确认功能还原
  doc.getElementById('tg-ime').click();
  await sleep(150);
  ok('输入法：切回直打模式', doc.getElementById('tg-ime').getAttribute('aria-pressed') === 'false');

  // ---------- 场景化故事短文模式 (Story Mode) ----------
  ok('故事：Stories 模块可用', typeof win.Stories === 'object' && Array.isArray(win.Stories.STORIES));
  ok('故事：内置故事篇目充足', win.Stories.STORIES.length >= 4, win.Stories.STORIES.length + ' 篇故事');

  // 切换模式到故事
  modeSel.value = 'story';
  modeSel.dispatchEvent(new win.Event('change', { bubbles: true }));
  await sleep(250);

  ok('故事：选篇下拉框显示', !doc.getElementById('field-story').hidden);
  ok('故事：词库与数量下拉框隐藏', doc.getElementById('field-level').hidden && doc.getElementById('field-count').hidden);
  ok('故事：故事全景视图展开', !doc.getElementById('story-view').hidden);
  ok('故事：故事标题渲染', doc.getElementById('story-title').textContent.trim().length > 0, doc.getElementById('story-title').textContent);
  ok('故事：段落列表渲染', doc.querySelectorAll('#story-paragraphs .story-line').length > 0,
     doc.querySelectorAll('#story-paragraphs .story-line').length + ' 行段落');

  const lines = [...doc.querySelectorAll('#story-paragraphs .story-line')];
  ok('故事：首行段落激活高亮', lines[0].classList.contains('is-active'));

  // 切换故事篇目
  const storySel = doc.getElementById('sel-story');
  storySel.value = 'my-cat';
  storySel.dispatchEvent(new win.Event('change', { bubbles: true }));
  await sleep(250);
  ok('故事：换篇刷新标题', doc.getElementById('story-title').textContent === '我的小猫咪咪', doc.getElementById('story-title').textContent);

  // 切回常规词模式
  modeSel.value = 'word';
  modeSel.dispatchEvent(new win.Event('change', { bubbles: true }));
  await sleep(200);
  ok('故事：切回词模式隐藏故事视图', doc.getElementById('story-view').hidden && !doc.getElementById('field-level').hidden);

  // ---------- 悬浮即时微词典 (Dict Tooltip) ----------
  ok('词典：Dict 模块可用', typeof win.Dict === 'object' && typeof win.Dict.lookup === 'function');
  const dInfo = win.Dict.lookup('喝');
  ok('词典：查询部首与释义正常', dInfo && dInfo.radical === '口' && dInfo.collocations.length > 0,
     '喝 -> 部首:' + dInfo.radical + ', 搭配=' + (dInfo.collocations || []).length);

  // 触发大汉字点击，校验词典卡片浮出
  doc.getElementById('hanzi').click();
  await sleep(150);
  ok('词典：点击汉字弹出词典卡片', !doc.getElementById('dict-tooltip').hidden);
  ok('词典：显示拼音与部首', doc.getElementById('dt-py').textContent.length > 0 &&
     doc.getElementById('dt-rad').textContent.includes('部首'));
  ok('词典：渲染搭配词汇 tags', doc.querySelectorAll('#dt-collocs .dict-colloc-tag').length > 0);

  // 敲字母打字时，词典卡片应自动无感隐藏
  typeChars(win, 'a');
  await sleep(80);
  ok('词典：打字时自动隐藏不打扰', doc.getElementById('dict-tooltip').hidden);

  // ---------- PWA 离线能力 ----------
  const mRes = await fetch('../manifest.json');
  ok('PWA：manifest.json 可访问', mRes.status === 200, 'status=' + mRes.status);
  const manifest = await mRes.json();
  ok('PWA：manifest 包含 standalone', manifest.display === 'standalone', manifest.display);
  ok('PWA：manifest 包含 192 与 512 图标',
     Array.isArray(manifest.icons) &&
     manifest.icons.some(i => i.sizes === '192x192') &&
     manifest.icons.some(i => i.sizes === '512x512'),
     (manifest.icons || []).map(i => i.sizes).join(', '));

  const i192 = await fetch('../icon-192.png');
  const i512 = await fetch('../icon-512.png');
  ok('PWA：icon-192.png 存在', i192.status === 200 && i192.headers.get('content-type').includes('png'), 'status=' + i192.status);
  ok('PWA：icon-512.png 存在', i512.status === 200 && i512.headers.get('content-type').includes('png'), 'status=' + i512.status);

  // 校验 sw.js 里列出的所有静态资源都能 fetch 成功
  const swRes = await fetch('../sw.js');
  ok('PWA：sw.js 可访问', swRes.status === 200);
  const swCode = await swRes.text();
  const matchedList = swCode.match(/var PRECACHE_URLS = \[(.*?)\];/s);
  ok('PWA：sw.js 包含预缓存清单', !!matchedList);
  if (matchedList) {
    const urls = JSON.parse('[' + matchedList[1].replace(/'/g, '"').replace(/,\s*\]/, ']') + ']');
    let allOk = true;
    for (const u of urls) {
      if (u === './') continue;
      const r = await fetch('../' + u.replace(/^\.\//, ''));
      if (r.status !== 200) { allOk = false; log.push('FAIL 预缓存资源缺失 :: ' + u + ' -> ' + r.status); }
    }
    ok('PWA：所有预缓存资源均可 200 访问', allOk, urls.length + ' 个资源');
  }

  // 校验 index.html meta 标签
  ok('PWA：iOS standalone meta 齐备',
     doc.querySelector('link[rel="manifest"]') &&
     doc.querySelector('link[rel="apple-touch-icon"]') &&
     doc.querySelector('meta[name="theme-color"]') &&
     doc.querySelector('meta[name="apple-mobile-web-app-capable"]'));

  } catch (err) {
    log.push('FAIL 用例中断 :: ' + (err && err.message ? err.message : String(err)));
  }
  window.__done = true;
  if (!log.some(l => l.startsWith('FAIL 用例中断'))) log.push('DONE');
  dumpLog();
  document.title = log.filter(l => l.startsWith('FAIL')).length + ' failures';
};

// 看门狗：卡住也要留下输出，避免“静默成功”
setTimeout(() => {
  if (!window.__done) {
    log.push('FAIL 超时未跑完（卡在第 ' + log.length + ' 项之后）');
    dumpLog();
  }
}, 90000);
</script>
</body></html>
